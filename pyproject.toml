[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "capstone-base"
version = "0.1.0"
description = "Mecanum drive development with fake and Hiwonder I2C controllers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pi = ["smbus2>=0.4,<1"]

[project.scripts]
capstone-base = "capstone_base.cli:main"
capstone-motor-test = "capstone_base.motor_test:main"
capstone-teleop = "capstone_base.keyboard_teleop:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
